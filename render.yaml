services:
  - type: web
    name: libflow
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && cd ../frontend && npm install --include=dev && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: libflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

  - type: postgres
    name: libflow-db
    plan: free
    databaseName: libflow
    ipAllowList: []
