services:
  - type: web
    name: libflow
    runtime: node
    plan: free
    buildCommand: npm install && cd frontend && npm install && npm run build
    startCommand: cd backend && npx prisma db push --skip-generate && cd .. && node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: libflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

  - type: postgres
    name: libflow-db
    plan: free
    databaseName: libflow
    ipAllowList: []
